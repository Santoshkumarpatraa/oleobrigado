<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-pd-doctitle>Product — Olé &amp; Obrigado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="has-buy-bar">

<header class="site-header" data-site-header data-active="Wine"></header>

<a href="browse.html" class="pd-back" data-pd-back>← All wines</a>
<nav class="breadcrumb only-desktop" aria-label="Breadcrumb" data-pd-breadcrumb></nav>

<main>
  <div class="pd-layout">
    <div class="pd-media-col">
      <div class="pd-gallery" data-pd-gallery><span>Bottle shot, on-white</span></div>
      <div class="pd-dots">
        <span class="pd-dot is-active"></span>
        <span class="pd-dot"></span>
        <span class="pd-dot"></span>
      </div>
    </div>

    <div class="pd-info">
      <div class="pd-producer-link" data-pd-producer></div>
      <h1 class="pd-title" data-pd-title></h1>
      <div class="pd-badges" data-pd-badges></div>
      <p class="pd-desc" data-pd-desc></p>

      <div class="pd-price-block">
        <div class="pd-price-row">
          <div class="pd-price" data-pd-price></div>
          <div class="pd-price-unit">per bottle</div>
        </div>
        <div class="pd-case-note" data-pd-case-note></div>
      </div>

      <div class="pd-buy-row">
        <div class="qty-stepper">
          <button type="button" class="qty-btn" data-qty-decrease aria-label="Decrease quantity">−</button>
          <div class="qty-value" data-qty-value>2</div>
          <button type="button" class="qty-btn" data-qty-increase aria-label="Increase quantity">+</button>
        </div>
        <button type="button" class="btn-add-cart" data-add-to-cart-qty>Add to cart</button>
      </div>

      <div class="pd-fulfillment">
        <div class="pd-fulfillment__dot"></div>
        <p>Fulfilled by <strong>Grand Wine Cellar, Brooklyn NY</strong> — a licensed retailer. Ships Tue–Fri, adult signature required.</p>
      </div>

      <div class="pd-specs" data-pd-specs></div>
    </div>
  </div>

  <section class="pd-related">
    <div class="section-head">
      <h2 class="section-head__title" data-pd-related-title></h2>
      <a href="browse.html" class="section-head__link" data-pd-related-link></a>
    </div>
    <div class="related-grid" data-product-grid="related"></div>
  </section>
</main>

<footer data-site-footer></footer>

<div class="buy-bar">
  <div class="buy-bar__price">
    <div class="buy-bar__price-main" data-pd-price></div>
    <div class="buy-bar__price-case" data-pd-buybar-case></div>
  </div>
  <button type="button" class="buy-bar__cta" data-add-to-cart-qty>Add to cart</button>
</div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/product.js"></script>
</body>
</html>
