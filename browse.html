<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all wines &amp; spirits — Olé &amp; Obrigado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" data-site-header data-active="Wine"></header>

<main class="browse-layout">
  <aside class="filter-sidebar" data-filter-sidebar></aside>

  <div class="browse-main">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="browse.html">Wine</a><span>/</span>
      <span class="breadcrumb__current">All bottles</span>
    </nav>

    <div class="browse-head">
      <div class="browse-head__meta">
        <span class="browse-count" data-result-count>0 results</span>
        <div class="sort-trigger-wrap">
          <button type="button" class="sort-select" data-sort-toggle>Sort: <span data-sort-label>Featured</span> ▾</button>
          <div class="sort-panel" data-sort-panel></div>
        </div>
      </div>
    </div>
    <p class="browse-count--mobile" data-result-count>0 results</p>

    <div class="mobile-toolbar">
      <div class="toolbar-btn-wrap">
        <button type="button" class="toolbar-btn" data-toolbar-filter>Filter <span class="filter-badge" data-filter-badge>0</span></button>
      </div>
      <div class="toolbar-btn-wrap">
        <button type="button" class="toolbar-btn" data-sort-toggle>Sort: <span data-sort-label>Featured</span> <span class="toolbar-btn__caret">▾</span></button>
        <div class="sort-panel" data-sort-panel></div>
      </div>
    </div>

    <div class="chip-row" data-chip-row></div>

    <p class="empty-state" data-empty-state hidden>No bottles match those filters. Try clearing a few, or search for something else.</p>

    <div class="product-grid product-grid--3col" data-product-grid="browse"></div>

    <div class="load-more-wrap">
      <div class="load-more-wrap__label" data-showing-count>Showing 0 of 0</div>
      <button type="button" class="btn btn-outline" data-load-more>Load 6 more</button>
    </div>
  </div>
</main>

<footer data-site-footer></footer>

<div class="sheet-backdrop" data-sheet-backdrop></div>
<div class="filter-sheet" data-filter-sheet>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="filter-sidebar__title">Filter <span class="filter-badge" data-filter-sheet-badge>0</span></div>
    <button type="button" class="sheet-head__clear" data-sheet-clear>Clear</button>
  </div>
  <div class="sheet-body" data-filter-sheet-body></div>
  <div class="sheet-foot">
    <button type="button" class="sheet-cta" data-sheet-apply>Show results</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/browse.js"></script>
</body>
</html>
